<form action="/upload" method="POST" enctype="multipart/form-data">
    <input
        type="text"
        name="name"
        pattern="[a-z0-9\-]+"
        placeholder="page name"
        required
    />
    <input type="file" name="zip" accept=".zip" required />
    <button type="submit">Upload</button>
</form>
