<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Resources – HTML Day</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="description" content="" />
        <link rel="icon" href="/favicon.svg" />
        <link rel="icon" href="/favicon.ico" />
        <style>
            body {
                display: flex;
                justify-content: center;
                flex-direction: column;
                align-items: center;
                margin: 0;
                padding: 0;
            }

            main {
                --grid-size: 4em;
                display: grid;
                grid-template-columns: repeat(8, var(--grid-size));
                grid-template-rows: repeat(36, var(--grid-size));
                padding: 0.5em;
                width: min-content;

                & section {
                    border: 1px solid black;
                    padding: 0.5em;
                    margin: 0.05em;
                    background-color: white;
                }

                & .intro {
                    grid-column: 2 / 7;
                    grid-row: 1 / 8;
                }
            }

            @media (max-width: 45em) {
                main {
                    --grid-size: min(4em, (100vw - 1em) / 8);
                    font-size: calc(100vw / 33);
                }
            }

            .bg {
                border: 1px solid var(--border);
                margin: 0.05em;
                text-align: center;
                background-color: var(--color);
                padding: 0.2em;
                display: flex;
                justify-content: center;
                align-items: center;

                & a {
                    color: var(--text-color);
                    font-size: xx-small;
                }

                &:hover,
                &:active {
                    background-color: blue;
                    color:white;
                }

                opacity: 0;
                animation: 50ms ease-in 0s forwards slide-in;
            }

            @keyframes slide-in {
                from {
                    opacity: 0;
                }

                to {
                    opacity: 1;
                }
            }

            form {
                display: grid;
                grid-template-columns: subgrid;
                grid-template-rows: subgrid;
                border: 1px solid black;

                & .name {
                    grid-column: 1 / 5;
                    justify-content: center;
                    align-items: center;
                    border: 1px solid black;
                    margin: 0.1em;


                    display: flex;

                    & input {
                        border: none;
                        margin: 0;
                        font-family: 'Times New Roman', Times, serif;
                    }
                }

                & .info {
                    grid-column: 1 / 6;
                    border: 1px solid black;
                    margin: 0.1em;
                    padding: 0.1em;
                }

                & .diagram {
                    grid-row: 3 / 6;
                    grid-column: 2 / 5;
                    border: 1px solid black;
                    margin: 0.1em;
                    padding: 0.1em;

                }
            }

            button,
            input {
                outline: unset;
                border: 1px solid black;
                background-color: transparent;
                margin: 0.1em;
                color: black;
                display: flex;
                justify-content: center;
                align-items: center;
            }
        </style>
    </head>
    <body>
        <main>
            <form class="intro" action="/upload" method="POST" enctype="multipart/form-data">
                <div class="name">
                    <div>
                    html.beer/
                    </div>
                    <input
                        type="text"
                        name="name"
                        pattern="[a-z0-9\-]+"
                        placeholder="your-page-name"
                        required
                    />
                </div>
                <input type="file" name="zip" accept=".zip" required />
                <div class="info">
                    Your submission must be a <b>.zip</b> file with an <b>index.html</b> file at the root.
                </div>
                <button type="submit">Upload</button>
                <div class="diagram">
                    my-website.zip
                    <ul>
                        <li>
                            index.html (required)
                        </li>
                        <li>
                            favicon.ico
                        </li>
                        <li>
                            sub-page/
                            <ul>
                                <li>
                                    my-face.png
                                </li>
                                <li>
                                    another-page.html
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </form>
        </main>

        <script>
            (async () => {
                const names = await (await fetch("/list")).json();

                const grid = document.querySelector("main");

                for (let i = 0; i < names.length; i++) {
                    const div = document.createElement("div");
                    div.className = "bg";
                    div.style.animationDelay = `${i * 210 + 400}ms`;

                    div.style.setProperty("--color", "white");
                    div.style.setProperty("--text-color", "black");
                    div.style.setProperty("--border", "black");
                    div.innerText = `/${name}`;

                    const anchor = document.createElement("a");
                    anchor.href = `/${name}`;

                    div.append(anchor)

                    grid.append(div);
                }
            })();
        </script>
    </body>
</html>
